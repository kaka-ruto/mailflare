name: Token Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Cloudflare API permissions
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          base="https://api.cloudflare.com/client/v4"

          probe() {
            local label="$1" url="$2" out code body summary slug
            slug="$(printf '%s' "$label" | sed 's/[^a-zA-Z0-9]/_/g; s/__*/_/g; s/_$//')"
            if out="$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "$url" 2>&1)"; then
              code="$(printf '%s' "$out" | tail -n1)"
              body="$(printf '%s' "$out" | sed '$d')"
              summary="$(printf '%s' "$body" | jq -r \
                'if .success == true then "success"
                 elif (.errors | type)=="array" and (.errors|length)>0 then "ERR code=\(.errors[0].code) \(.errors[0].message)"
                 else "HTTP body=" + (tostring | .[0:160]) end' 2>/dev/null || printf 'unparsable')"
            else
              code="CURL"; body="$out"; summary="$out"
            fi
            printf '%-38s HTTP %s  %s\n' "$label" "$code" "$summary"
            printf '%s' "$body" > "/tmp/${slug}.json"
          }

          show() {
            local label="$1" filter="$2" slug
            slug="$(printf '%s' "$label" | sed 's/[^a-zA-Z0-9]/_/g; s/__*/_/g; s/_$//')"
            echo "== ${label} =="
            if [ -f "/tmp/${slug}.json" ]; then
              jq -c "$filter" "/tmp/${slug}.json" 2>/dev/null || echo "(unparsable)"
            else
              echo "(no file)"
            fi
          }

          echo "== token / workers =="
          probe "tokens verify" "$base/user/tokens/verify"
          probe "workers subdomain" "$base/accounts/${CF_ACCOUNT_ID}/workers/subdomain"
          probe "mailflare service" "$base/accounts/${CF_ACCOUNT_ID}/workers/services/mailflare"
          probe "mailflare settings" "$base/accounts/${CF_ACCOUNT_ID}/workers/scripts/mailflare/settings"
          echo "== d1 (expected denied) =="
          probe "d1 list" "$base/accounts/${CF_ACCOUNT_ID}/d1/database"
          echo "== r2 / queues =="
          probe "r2 buckets" "$base/accounts/${CF_ACCOUNT_ID}/r2/buckets"
          probe "queues" "$base/accounts/${CF_ACCOUNT_ID}/queues"
          echo "== zone =="
          probe "zones kawibot com" "$base/zones?name=kawibot.com"
          zone_id="$(jq -r '.result[0].id // empty' /tmp/zones_kawibot_com.json 2>/dev/null || true)"
          echo "zone_id=${zone_id}"
          if [ -n "${zone_id}" ]; then
            probe "zone dns records" "$base/zones/${zone_id}/dns_records?per_page=100"
            probe "zone workers domains" "$base/zones/${zone_id}/workers/domains"
            probe "zone workers routes" "$base/zones/${zone_id}/workers/routes"
            probe "zone email routing rules" "$base/zones/${zone_id}/email/routing/rules"
            probe "zone email routing catchall" "$base/zones/${zone_id}/email/routing/catch_all"
            probe "zone email routing address" "$base/zones/${zone_id}/email/routing/address"
          fi

          show "mailflare settings" '{success, bindings: [.result.bindings[]? | {type, name, id, namespace_id, queue_name, bucket_name, database_name}], env: (.result.env // null | if . then (keys) else null end)}'
          show "r2 buckets" '{success, buckets: [.result.buckets[]? | .name]}'
          show "queues" '{success, queues: [.result[]? | .queue_name]}'
          show "workers subdomain" '{success, subdomain: .result.subdomain}'
          show "mailflare service" '{success, env: (.result.env // null | if . then keys else null end), created_on: .result.created_on, modified_on: .result.modified_on}'
          show "zone dns records" '{success, records: [.result[]? | {type, name, content, proxied}]}'
          show "zone workers domains" '{success, domains: [.result[]? | {hostname, service, environment, id}]}'
          show "zone workers routes" '{success, routes: [.result[]? | {pattern, script}]}'
          show "zone email routing rules" '{success, errors, rules: [.result[]? | {name, enabled, priority, action: .action.type, value: (.action.value // null), matcher: .matcher.type, matcherValue: (.matcher.value // null)}]}'
          show "zone email routing catchall" '{success, errors, result}'
          show "zone email routing address" '{success, errors, result}'
